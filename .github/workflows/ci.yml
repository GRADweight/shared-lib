# CI für gw-shared-lib (stdlib+optional, kein Netz)

name: gw-shared-lib

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile check
        run: python -m compileall -q gw_shared_lib/ tests/
      - name: pytest
        run: python -m pytest -q
      - name: Smoke (offline, kein Netz)
        run: |
          python -m gw_shared_lib smoke
          # Exit-0 = GREEN (10/10 tests + smoke-OK)
