name: gw-shared-lib smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Smoke-offlin (StubClient, kein Netz)
        run: |
          cd gw-shared-lib
          python -m gw_shared_lib smoke
      - name: Tests
        run: |
          cd gw-shared-lib
          python -m compileall -q gw_shared_lib/ tests/
          python -m pytest -q
